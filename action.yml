name: FlagOps
description: Manage Flagsmith flags like code. Plan flag changes on pull requests, apply them on merge, catch drift.
author: Akash V
branding:
  icon: flag
  color: purple

inputs:
  command:
    description: "validate, plan, apply or drift"
    required: true
  api-url:
    description: "Flagsmith API URL, e.g. https://flagsmith.example.com/api/v1 (not needed for validate)"
    required: false
    default: ""
  admin-key:
    description: "Flagsmith Admin API key, needed for apply. Store it in a GitHub Environment secret limited to main"
    required: false
    default: ""
  environment-keys:
    description: "Read-only server-side environment keys (ser...), one per environment, separated by spaces or new lines. Used by plan and drift instead of admin-key"
    required: false
    default: ""
  project:
    description: "Flagsmith project id or name (only needed if there are several; ignored with environment-keys)"
    required: false
    default: ""
  dir:
    description: "Folder with the flag files"
    required: false
    default: "flags"
  environments:
    description: "Comma-separated environment names to include (default: all files)"
    required: false
    default: ""
  comment:
    description: "For plan on a pull request: post the plan as a comment (true/false)"
    required: false
    default: "true"
  issue:
    description: "For drift: open an issue when drift is found, and close it once fixed (true/false)"
    required: false
    default: "true"
  github-token:
    description: "Token used to post the pull request comment or drift issue"
    required: false
    default: ${{ github.token }}

outputs:
  changes:
    description: "plan: number of changes the plan contains"
    value: ${{ steps.run.outputs.changes }}
  drift:
    description: "drift: true if Flagsmith differs from the flag files"
    value: ${{ steps.run.outputs.drift }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 22

    # dist/ is a prebuilt bundle with no dependencies, so there is nothing to install.
    # Steps run with Node, not bash, so they work on Linux, macOS and Windows runners.
    - name: Run flagops ${{ inputs.command }}
      id: run
      shell: node {0}
      env:
        FLAGSMITH_API_URL: ${{ inputs.api-url }}
        FLAGSMITH_ADMIN_KEY: ${{ inputs.admin-key }}
        FLAGSMITH_ENVIRONMENT_KEYS: ${{ inputs.environment-keys }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_DIR: ${{ inputs.dir }}
        INPUT_ENVIRONMENTS: ${{ inputs.environments }}
      run: |
        require(require("node:path").join(process.env.GITHUB_ACTION_PATH, "dist", "action.cjs"));

    - name: Post plan on the pull request
      if: inputs.command == 'plan' && inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v8
      env:
        PLAN_FILE: ${{ steps.run.outputs.report-file }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          const body = fs.readFileSync(process.env.PLAN_FILE, "utf8");
          const marker = "<!-- flagops-plan -->";
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          // Only a bot's comment: anyone can post a comment that starts with the marker.
          const mine = comments.find((c) => c.user?.type === "Bot" && c.body?.startsWith(marker));
          if (mine) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Open, update or close the drift issue
      if: inputs.command == 'drift' && inputs.issue == 'true'
      uses: actions/github-script@v8
      env:
        REPORT_FILE: ${{ steps.run.outputs.report-file }}
        DRIFT: ${{ steps.run.outputs.drift }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          const body = fs.readFileSync(process.env.REPORT_FILE, "utf8");
          const drift = process.env.DRIFT === "true";
          const marker = "<!-- flagops-drift -->";
          const { owner, repo } = context.repo;
          const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", per_page: 100 });
          // Only a bot's issue: anyone can open an issue that starts with the marker.
          const existing = open.find((i) => !i.pull_request && i.user?.type === "Bot" && i.body?.startsWith(marker));
          const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

          if (drift && existing) {
            await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            core.info(`Updated drift issue #${existing.number}`);
          } else if (drift) {
            const { data } = await github.rest.issues.create({ owner, repo, title: "Flag drift: Flagsmith no longer matches Git", body });
            core.info(`Opened drift issue #${data.number}`);
          } else if (existing) {
            await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `Flagsmith matches Git again ([check run](${runUrl})). Closing.` });
            await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: "closed", state_reason: "completed" });
            core.info(`Closed drift issue #${existing.number}`);
          } else {
            core.info("No drift and no open drift issue.");
          }
