# Unit tests, plus a full round trip against a real self-hosted Flagsmith in Docker:
# seed -> pull -> validate -> plan -> apply -> drift -> stale.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build, and check the committed dist/ is up to date
        run: |
          npm run build
          git diff --exit-code dist || (echo "dist/ is out of date: run npm run build and commit it" && exit 1)

  integration:
    runs-on: ubuntu-latest
    env:
      FLAGSMITH_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Start Flagsmith
        run: |
          docker compose up -d
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8000/health/readiness/ > /dev/null; then echo "Flagsmith is up"; exit 0; fi
            sleep 2
          done
          docker compose logs flagsmith | tail -50
          exit 1

      - name: Create user, organisation, project and API key
        run: npx tsx scripts/ci-bootstrap.ts

      - name: Seed demo flags
        run: npm run seed

      - name: Round trip
        run: |
          cli="node $GITHUB_WORKSPACE/dist/cli.cjs"
          mkdir -p "$RUNNER_TEMP/e2e" && cd "$RUNNER_TEMP/e2e"

          expect_exit() { # expect_exit <code> <command...>
            local want=$1; shift
            set +e; "$@"; local got=$?; set -e
            if [ "$got" -ne "$want" ]; then echo "::error::expected exit $want, got $got: $*"; exit 1; fi
          }

          echo "--- pull"
          $cli pull
          ls flags
          $cli validate

          echo "--- drift right after pull: none"
          expect_exit 0 $cli drift

          echo "--- stale: flags tagged permanent are skipped"
          $cli stale --days 0 --no-code | tee stale.txt
          grep -q dark_mode stale.txt
          if grep -q maintenance_mode stale.txt; then echo "::error::permanent flag listed as stale"; exit 1; fi

          echo "--- edit production.yaml, plan, apply"
          sed -i '/max_cart_items:/{n;n;s/value: 10/value: 25/}' flags/production.yaml
          grep -A2 max_cart_items: flags/production.yaml
          $cli plan --no-code | tee plan.txt
          grep -q max_cart_items plan.txt
          $cli apply --yes
          expect_exit 0 $cli drift

          echo "--- a new flag in every file: created, and no false drift"
          for f in flags/*.yaml; do
            if [ "$f" = flags/development.yaml ]; then on=true; val='"hello"'; else on=false; val=null; fi
            printf '  ci_new_flag:\n    enabled: %s\n    value: %s\n' "$on" "$val" >> "$f"
          done
          $cli validate
          $cli apply --yes
          expect_exit 0 $cli drift

          echo "--- a new flag in only one file: rejected offline"
          cp -r flags flags-bad
          printf '  only_in_dev:\n    enabled: true\n    value: null\n' >> flags-bad/development.yaml
          expect_exit 1 $cli validate --dir flags-bad

          echo "--- change Production by hand through the API: drift found"
          auth="Authorization: Api-Key $FLAGSMITH_ADMIN_KEY"
          env_key=$(curl -sf -H "$auth" "$FLAGSMITH_API_URL/environments/?project=$FLAGSMITH_PROJECT" \
            | jq -r '(.results? // .) | .[] | select(.name=="Production") | .api_key')
          feature=$(curl -sf -H "$auth" "$FLAGSMITH_API_URL/projects/$FLAGSMITH_PROJECT/features/?search=dark_mode" \
            | jq -r '(.results? // .) | .[] | select(.name=="dark_mode") | .id')
          state=$(curl -sf -H "$auth" "$FLAGSMITH_API_URL/environments/$env_key/featurestates/?feature=$feature" \
            | jq -r '(.results? // .) | .[] | select(.identity==null and .feature_segment==null) | .id')
          curl -sf -X PATCH -H "$auth" -H "Content-Type: application/json" \
            -d '{"enabled": false}' "$FLAGSMITH_API_URL/environments/$env_key/featurestates/$state/" > /dev/null
          expect_exit 2 $cli drift

          echo "--- apply puts it back"
          $cli apply --yes
          expect_exit 0 $cli drift

          echo "--- read-only server-side keys: plan and drift work without the admin key"
          keys=""
          for k in $(curl -sf -H "$auth" "$FLAGSMITH_API_URL/environments/?project=$FLAGSMITH_PROJECT" | jq -r '(.results? // .) | .[].api_key'); do
            keys="$keys $(curl -sf -X POST -H "$auth" -H "Content-Type: application/json" \
              -d '{"name": "ci"}' "$FLAGSMITH_API_URL/environments/$k/api-keys/" | jq -r .key)"
          done
          readonly_cli="env FLAGSMITH_ADMIN_KEY=wrong-on-purpose FLAGSMITH_ENVIRONMENT_KEYS=$(echo $keys | tr ' ' ',') $cli"
          expect_exit 0 $readonly_cli drift
          $readonly_cli plan --no-code
          curl -sf -X PATCH -H "$auth" -H "Content-Type: application/json" \
            -d '{"enabled": false}' "$FLAGSMITH_API_URL/environments/$env_key/featurestates/$state/" > /dev/null
          expect_exit 2 $readonly_cli drift
          echo "--- read-only keys can't use the Admin API, so they can't apply"
          server_key=$(echo $keys | awk '{print $1}')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Api-Key $server_key" "$FLAGSMITH_API_URL/projects/")
          echo "Admin API with a server-side key: HTTP $code"
          if [ "$code" != 401 ] && [ "$code" != 403 ]; then echo "::error::Admin API accepted a server-side key"; exit 1; fi
          expect_exit 1 env FLAGSMITH_ADMIN_KEY=$server_key FLAGSMITH_ENVIRONMENT_KEYS= $cli apply --yes
          $cli apply --yes
          expect_exit 0 $readonly_cli drift

          echo "--- archive a flag in Flagsmith: apply stops until the YAML marks it, then every mode agrees"
          legacy=$(curl -sf -H "$auth" "$FLAGSMITH_API_URL/projects/$FLAGSMITH_PROJECT/features/?search=legacy_payments" \
            | jq -r '(.results? // .) | .[] | select(.name=="legacy_payments") | .id')
          curl -sf -X PATCH -H "$auth" -H "Content-Type: application/json" \
            -d '{"is_archived": true}' "$FLAGSMITH_API_URL/projects/$FLAGSMITH_PROJECT/features/$legacy/" > /dev/null
          expect_exit 2 $cli drift
          expect_exit 1 $cli apply --yes
          $cli pull
          grep -A1 legacy_payments: flags/production.yaml | grep -q "archived: true"
          $cli validate
          expect_exit 0 $cli drift
          expect_exit 0 $readonly_cli drift
          $cli apply --yes

          echo "--- an archived flag changed in the dashboard: Flagsmith still serves it, so both modes report drift"
          legacy_state=$(curl -sf -H "$auth" "$FLAGSMITH_API_URL/environments/$env_key/featurestates/?feature=$legacy" \
            | jq -r '(.results? // .) | .[] | select(.identity==null and .feature_segment==null) | .id')
          was=$(curl -sf -H "$auth" "$FLAGSMITH_API_URL/environments/$env_key/featurestates/$legacy_state/" | jq -r .enabled)
          flip=$([ "$was" = true ] && echo false || echo true)
          curl -sf -X PATCH -H "$auth" -H "Content-Type: application/json" \
            -d "{\"enabled\": $flip}" "$FLAGSMITH_API_URL/environments/$env_key/featurestates/$legacy_state/" > /dev/null
          expect_exit 2 $cli drift
          expect_exit 2 $readonly_cli drift
          echo "--- apply leaves archived flags alone"
          $cli apply --yes | tee apply.txt
          grep -q "Nothing to apply" apply.txt
          expect_exit 2 $cli drift

          echo "--- unarchived in the dashboard: admin drift reports it, apply refuses and changes nothing"
          curl -sf -X PATCH -H "$auth" -H "Content-Type: application/json" \
            -d '{"is_archived": false}' "$FLAGSMITH_API_URL/projects/$FLAGSMITH_PROJECT/features/$legacy/" > /dev/null
          $cli drift | tee drift.txt || true
          grep -q "unarchived outside Git" drift.txt
          expect_exit 1 $cli apply --yes
          echo "--- archived again: apply runs, and the archived flag's dashboard edit is still drift"
          curl -sf -X PATCH -H "$auth" -H "Content-Type: application/json"             -d '{"is_archived": true}' "$FLAGSMITH_API_URL/projects/$FLAGSMITH_PROJECT/features/$legacy/" > /dev/null
          $cli apply --yes
          expect_exit 2 $cli drift

          # For the Action steps below.
          echo "CI_FLAGS_DIR=$RUNNER_TEMP/e2e/flags" >> "$GITHUB_ENV"
          echo "CI_ENV_KEYS=$(echo $keys | tr ' ' ',')" >> "$GITHUB_ENV"
          echo "All round-trip checks passed."

      # The same checks through the Action itself (action.yml + dist/action.cjs), not only the CLI.
      - name: "Action: validate"
        uses: ./
        with:
          command: validate
          dir: ${{ env.CI_FLAGS_DIR }}

      - name: "Action: plan with read-only keys"
        id: plan
        uses: ./
        with:
          command: plan
          api-url: ${{ env.FLAGSMITH_API_URL }}
          environment-keys: ${{ env.CI_ENV_KEYS }}
          dir: ${{ env.CI_FLAGS_DIR }}
          comment: "false"

      - name: "Action: drift with the admin key"
        id: drift
        uses: ./
        with:
          command: drift
          api-url: ${{ env.FLAGSMITH_API_URL }}
          admin-key: ${{ env.FLAGSMITH_ADMIN_KEY }}
          project: ${{ env.FLAGSMITH_PROJECT }}
          dir: ${{ env.CI_FLAGS_DIR }}
          issue: "false"

      - name: "Action: apply (nothing to change: apply leaves archived flags alone)"
        id: apply
        uses: ./
        with:
          command: apply
          api-url: ${{ env.FLAGSMITH_API_URL }}
          admin-key: ${{ env.FLAGSMITH_ADMIN_KEY }}
          project: ${{ env.FLAGSMITH_PROJECT }}
          dir: ${{ env.CI_FLAGS_DIR }}

      - name: Check the Action results
        env:
          CHANGES: ${{ steps.plan.outputs.changes }}
          DRIFT: ${{ steps.drift.outputs.drift }}
          APPLY: ${{ steps.apply.outcome }}
        run: |
          echo "plan changes=$CHANGES, drift=$DRIFT, apply=$APPLY"
          [ "$CHANGES" = 0 ] || { echo "::error::expected 0 planned changes"; exit 1; }
          [ "$DRIFT" = true ] || { echo "::error::expected drift"; exit 1; }
          [ "$APPLY" = success ] || { echo "::error::apply failed"; exit 1; }
          grep -q "archived flag changed outside Git" "$RUNNER_TEMP/flagops-drift.md"
          grep -q "read-only keys" "$RUNNER_TEMP/flagops-plan.md"

      - name: Flagsmith logs on failure
        if: failure()
        run: docker compose logs --tail 100
