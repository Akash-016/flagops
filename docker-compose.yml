# Self-hosted Flagsmith for trying FlagOps locally.
# Based on Flagsmith's official docker-compose.yml:
#   https://github.com/Flagsmith/flagsmith/blob/main/docker-compose.yml
#
#   docker compose up -d        then open http://localhost:8000
#
# Pinned to the Flagsmith version FlagOps was tested with. Local demo settings only:
# change the secrets before exposing this anywhere.

x-flagsmith-env: &flagsmith-env
  DATABASE_URL: postgresql://postgres:password@postgres:5432/flagsmith
  USE_POSTGRES_FOR_ANALYTICS: "true"
  ENVIRONMENT: production
  DJANGO_ALLOWED_HOSTS: "*"
  FLAGSMITH_DOMAIN: localhost:8000
  DJANGO_SECRET_KEY: change-me-local-demo-only
  WAREHOUSE_CREDENTIALS_SECRET: change-me-local-demo-only
  TASK_RUN_METHOD: TASK_PROCESSOR

volumes:
  pgdata:

services:
  postgres:
    image: postgres:15.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flagsmith
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d flagsmith -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 20s

  migrate-db:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.295.2
    command: [migrate]
    environment:
      <<: *flagsmith-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  flagsmith:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.295.2
    restart: unless-stopped
    command: [serve]
    environment:
      <<: *flagsmith-env
    ports:
      - 127.0.0.1:8000:8000 # this machine only; change it to reach Flagsmith from elsewhere
    depends_on:
      migrate-db:
        condition: service_completed_successfully

  flagsmith-task-processor:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.295.2
    restart: unless-stopped
    command: [run-task-processor]
    environment:
      <<: *flagsmith-env
    depends_on:
      migrate-db:
        condition: service_completed_successfully
