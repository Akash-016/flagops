# Copy to .github/workflows/ in the repo that holds your flag files.
# On every pull request that touches flags/, posts the FlagOps plan as a comment.
# Skipped on fork pull requests (they get no secrets). flagops-validate.yml checks
# the files themselves.
#
# The plan job must reach your Flagsmith. If Flagsmith is only on a private network or your
# own machine, use a self-hosted runner instead of ubuntu-latest (on a private repo only:
# GitHub advises against self-hosted runners for public repos).

name: FlagOps plan

on:
  pull_request:
    paths:
      - "flags/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Akash-016/flagops@v1
        with:
          command: plan
          api-url: ${{ vars.FLAGSMITH_API_URL }}
          admin-key: ${{ secrets.FLAGSMITH_ADMIN_KEY }}
