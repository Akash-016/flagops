# Copy to .github/workflows/ in the repo that holds your flag files.
# On every pull request that touches flags/, posts the FlagOps plan as a comment.
# Skipped on fork pull requests (they get no secrets). flagops-validate.yml checks
# the files themselves.
#
# plan only reads flags, so it uses read-only server-side environment keys, never the
# admin key. Secret FLAGSMITH_ENVIRONMENT_KEYS: one key per environment (Flagsmith:
# Environment settings -> SDK Keys -> Server-side), separated by spaces or new lines.
#
# The plan job must reach your Flagsmith. If Flagsmith is only on a private network or your
# own machine, use a self-hosted runner instead of ubuntu-latest (see "Security model").

name: FlagOps plan

on:
  pull_request:
    paths:
      - "flags/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # No admin key in this job, so the moving v1 tag (fixes arrive automatically) is a fair
      # trade. Pin a commit SHA instead if your policy requires it, as flagops-apply.yml does.
      - uses: Akash-016/flagops@v1
        with:
          command: plan
          api-url: ${{ vars.FLAGSMITH_API_URL }}
          environment-keys: ${{ secrets.FLAGSMITH_ENVIRONMENT_KEYS }}
