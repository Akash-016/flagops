# Copy to .github/workflows/ in the repo that holds your flag files.
# On merge to main: applies non-production flags right away, then waits for a
# reviewer to approve before applying production.
#
# Setup: Settings -> Environments -> New environment "production"
#        -> Required reviewers -> add who may approve production flag changes.
# See "Security model" in the FlagOps README for what else to protect.
#
# If Flagsmith is only reachable on a private network, use a self-hosted runner
# instead of ubuntu-latest (private repos only).

name: FlagOps apply

on:
  push:
    branches: [main]
    paths:
      - "flags/**"

permissions:
  contents: read

concurrency:
  group: flagops-apply
  cancel-in-progress: false

jobs:
  apply-non-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Akash-016/flagops@v1
        with:
          command: apply
          environments: Development, Staging
          api-url: ${{ vars.FLAGSMITH_API_URL }}
          admin-key: ${{ secrets.FLAGSMITH_ADMIN_KEY }}

  apply-production:
    needs: apply-non-production
    runs-on: ubuntu-latest
    environment: production # waits here for a required reviewer
    steps:
      - uses: actions/checkout@v5
      - uses: Akash-016/flagops@v1
        with:
          command: apply
          environments: Production
          api-url: ${{ vars.FLAGSMITH_API_URL }}
          admin-key: ${{ secrets.FLAGSMITH_ADMIN_KEY }}
