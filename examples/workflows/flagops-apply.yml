# Copy to .github/workflows/ in the repo that holds your flag files.
# On merge to main: applies non-production flags first, then waits for a
# reviewer to approve before applying production. If your environments have other names,
# change them below. The reviewer finds the exact Production
# plan in the run's summary (written by the non-production job) before approving.
#
# Rejecting the production deployment leaves Git ahead of Production: revert the pull request,
# or the next drift check reports the difference and the next approved apply makes the change.
#
# The Production plan is made before the approval. A dashboard change in Production between that
# plan and the approval is applied over too; the production job's log lists what it changed.
#
# Each apply checks that its flag files are still the ones on main, so re-running an old run
# can't put old flag files back; to apply the current main again, use "Run workflow".
#
# The non-production job applies only the environments listed, and refuses (changing nothing)
# if any of them looks like production. Add a new non-production environment to that list.
#
# Only apply gets the admin key, and only through GitHub Environments limited to main,
# so no pull request workflow can read it. Setup (Settings -> Environments):
#   - "non-production": Deployment branches -> Selected branches -> main.
#     Environment secret FLAGSMITH_ADMIN_KEY.
#   - "production": the same, plus Required reviewers (who may approve production changes).
# Don't keep FLAGSMITH_ADMIN_KEY as a repository secret. See "Security model" in the README.
#
# If Flagsmith is only reachable on a private network, use a self-hosted runner
# instead of ubuntu-latest (see "Security model").

name: FlagOps apply

on:
  push:
    branches: [main]
    paths:
      - "flags/**"
  workflow_dispatch: # run it by hand (Actions tab) to apply the current main again

permissions:
  contents: read

jobs:
  apply-non-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: non-production
    # One group per job, so non-production never waits behind an earlier run's
    # production approval. A newer pending run replaces an older one; it applies
    # the latest main, which includes the older change.
    concurrency: flagops-apply-non-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Akash-016/flagops@8f999fd384a932a91043133bdc5dda74b4929f2b # v1.4.0: pinned, since this job holds the admin key
        with:
          command: apply
          environments: Development, Staging # list every non-production environment here
          allow-production: "false" # refuse, changing nothing, if a production-like one slips in
          api-url: ${{ vars.FLAGSMITH_API_URL }}
          admin-key: ${{ secrets.FLAGSMITH_ADMIN_KEY }}
      # What the production job will change, in this run's summary, so the reviewer sees it
      # before approving. It includes any dashboard change in Production that apply would undo.
      - name: Production plan for the reviewer
        uses: Akash-016/flagops@8f999fd384a932a91043133bdc5dda74b4929f2b # v1.4.0
        with:
          command: plan
          environments: Production
          comment: "false"
          api-url: ${{ vars.FLAGSMITH_API_URL }}
          admin-key: ${{ secrets.FLAGSMITH_ADMIN_KEY }}

  apply-production:
    needs: apply-non-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production # waits here for a required reviewer
    concurrency: flagops-apply-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Akash-016/flagops@8f999fd384a932a91043133bdc5dda74b4929f2b # v1.4.0: pinned, since this job holds the admin key
        with:
          command: apply
          environments: Production
          api-url: ${{ vars.FLAGSMITH_API_URL }}
          admin-key: ${{ secrets.FLAGSMITH_ADMIN_KEY }}
