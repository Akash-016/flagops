# Copy to .github/workflows/ in the repo that holds your flag files.
# On merge to main: applies non-production flags first, then waits for a
# reviewer to approve before applying production.
#
# Only apply gets the admin key, and only through GitHub Environments limited to main,
# so no pull request workflow can read it. Setup (Settings -> Environments):
#   - "non-production": Deployment branches -> Selected branches -> main.
#     Environment secret FLAGSMITH_ADMIN_KEY.
#   - "production": the same, plus Required reviewers (who may approve production changes).
# Don't keep FLAGSMITH_ADMIN_KEY as a repository secret. See "Security model" in the README.
#
# If Flagsmith is only reachable on a private network, use a self-hosted runner
# instead of ubuntu-latest (see "Security model").

name: FlagOps apply

on:
  push:
    branches: [main]
    paths:
      - "flags/**"

permissions:
  contents: read

jobs:
  apply-non-production:
    runs-on: ubuntu-latest
    environment: non-production
    # One group per job, so non-production never waits behind an earlier run's
    # production approval. A newer pending run replaces an older one; it applies
    # the latest main, which includes the older change.
    concurrency: flagops-apply-non-production
    steps:
      - uses: actions/checkout@v5
      - uses: Akash-016/flagops@v1
        with:
          command: apply
          environments: Development, Staging
          api-url: ${{ vars.FLAGSMITH_API_URL }}
          admin-key: ${{ secrets.FLAGSMITH_ADMIN_KEY }}

  apply-production:
    needs: apply-non-production
    runs-on: ubuntu-latest
    environment: production # waits here for a required reviewer
    concurrency: flagops-apply-production
    steps:
      - uses: actions/checkout@v5
      - uses: Akash-016/flagops@v1
        with:
          command: apply
          environments: Production
          api-url: ${{ vars.FLAGSMITH_API_URL }}
          admin-key: ${{ secrets.FLAGSMITH_ADMIN_KEY }}
