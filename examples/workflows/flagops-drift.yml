# Copy to .github/workflows/ in the repo that holds your flag files.
# Checks once a day whether someone changed flags outside Git (for example in the
# Flagsmith dashboard). Opens an issue listing the drift, and closes it once fixed.
#
# drift only reads flags, so it uses the read-only FLAGSMITH_ENVIRONMENT_KEYS secret
# (see flagops-plan.yml), never the admin key. Read-only keys can't see whether a flag is
# archived, so this misses a flag archived or unarchived in the dashboard (settings changes
# to archived flags are still caught). To catch that too, give the job the admin key instead:
# add `environment: non-production` to the job and `admin-key: ${{ secrets.FLAGSMITH_ADMIN_KEY }}`
# in place of environment-keys. That environment only serves main, which is what a schedule runs on.
#
# If Flagsmith is only reachable on a private network, use a self-hosted runner
# instead of ubuntu-latest (see "Security model").

name: FlagOps drift check

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC; make it more often if you like
  workflow_dispatch: # also allows a manual run from the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # With read-only keys, the moving v1 tag (fixes arrive automatically) is a fair trade.
      # If you give this job the admin key (see above), pin a commit SHA, as flagops-apply.yml does.
      - uses: Akash-016/flagops@v1
        with:
          command: drift
          api-url: ${{ vars.FLAGSMITH_API_URL }}
          environment-keys: ${{ secrets.FLAGSMITH_ENVIRONMENT_KEYS }}
